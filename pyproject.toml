[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsight"
version = "0.1.0"
authors = [
  { name="Moreno Franjković", email="moreno.franjkovic@outlook.com" },
]
description = "Python SDK for AgentSight: seamlessly track AI conversations, metrics, and deliver client-facing insights and dashboards."
readme = "README.md"
requires-python = ">=3.9,<4.0"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = "MIT"
keywords = ["AI", "AI Agents", "Monitoring", "Tracking", "Analytics", "Chatbot"]
dependencies = [
    "requests>=2.25.0",
    # The 1.0 SDK is built on OpenTelemetry. The SDK package (not just the API)
    # is required because AgentSight supplies its own TracerProvider, span
    # processors and exporter. No OTLP exporter and no Collector — spans go to
    # the AgentSight REST API directly.
    "opentelemetry-sdk>=1.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "requests-mock",
    # `timeout = 30` under [tool.pytest.ini_options] is read by this plugin and
    # by nothing else; without it the setting is silently inert and a hung test
    # hangs CI instead of failing it.
    "pytest-timeout",
    # Provider integrations are tested against a mock transport rather than the
    # network, which needs the provider SDK present to exercise its real
    # streaming decoder. Tests skip cleanly when one is absent — which is the
    # trap: a provider missing here does not fail, it quietly tests nothing.
    "httpx",
    "openai",
    "anthropic",
    "langchain-core",
    "llama-index-core",
]

dev = [
    # Testing essentials
    "pytest>=8.0.0",
    "pytest-cov", 
    "pytest-mock",
    "pytest-asyncio",
    "requests-mock",
    
    # Code quality and type checking
    "ruff",
    "mypy",
    "types-requests",
    
    # Development tools
    "python-dotenv",
    
    # Debugging and utilities
    "ipython>=8.0.0",
]

[project.urls]
Homepage = "https://agentsight.io"
Documentation = "https://docs.agentsight.io"
Repository = "https://github.com/agentsightio/agentsightio"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -p no:warnings --import-mode=importlib"
pythonpath = ["."]
timeout = 30
log_cli = true
log_cli_level = "INFO"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.mypy]
# Matches the CI lint job, not requires-python: the installed OTel SDK uses
# 3.10+ `match` syntax, which mypy refuses to parse under python_version 3.9.
# Runtime 3.9 compatibility is the test matrix's job.
python_version = "3.11"
# check_untyped_defs is deliberately off for now: several function bodies in
# watchdog.py and core.py are currently unchecked (mypy notes them), and
# turning it on surfaces new errors — worthwhile, but its own piece of work.
# Flip it in a change that also clears what it finds.

# mypy 1.16 crashes with an INTERNAL ERROR while analysing the provider SDKs
# (anthropic/_client.py, openai/_client.py). They are installed by the `test`
# extra so they are always found — the problem is analysing them, hence
# follow_imports = "skip" rather than ignore_missing_imports.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "langchain_core.*", "llama_index.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
# Matches requires-python. Was py37, which let ruff accept syntax
# the project itself does not support.
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E712",  # Comparison to True/False
    "E711",  # Comparison to None
    "E722",  # Bare except
]

exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "docs",
    "examples",
    "tests/manual",
]

[tool.hatch.build.targets.wheel]
packages = ["agentsight"]

[tool.hatch.build]
exclude = [
    "docs/*",
    "node_modules/*",
    "venv/*",
    "examples/*",
    "tests/*",
    ".github/*",
    # Local-only. Both are kept out of git as well, but hatchling does not read
    # the global gitignore, so without these the sdist ships them.
    "design/*",
    ".claude/*",
    ".playwright-mcp/*",
    "*.gif",
    "*.png",
    "dist/*",
    "build/*",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "*.pyc"
]

[tool.hatch.metadata]
allow-direct-references = true

